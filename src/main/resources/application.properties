spring.application.name=allocationsystem
server.port=${PORT:8081}

# ==============================================================================
# Database Configuration (Personal Supabase PostgreSQL or Local H2 Fallback)
# ==============================================================================
# When running with a personal Supabase project, set DB_URL, DB_USERNAME, and DB_PASSWORD in .env.
# If none are provided, the system defaults to an in-memory H2 database for local testing.
spring.datasource.url=${DB_URL:jdbc:h2:mem:allocationsystem;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate Auto-DDL Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP Cloud Resilience Settings (Prevents Supabase Pooler idle drops)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=90000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# Disable Thymeleaf template caching for rapid UI development
spring.thymeleaf.cache=false
